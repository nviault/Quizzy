version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizzy-postgres
    restart: always
    environment:
      POSTGRES_USER: quizzy
      POSTGRES_PASSWORD: quizzy_password
      POSTGRES_DB: quizzy_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quizzy-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quizzy-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://quizzy:quizzy_password@postgres:5432/quizzy_db?schema=public
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: quizzy-frontend
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
